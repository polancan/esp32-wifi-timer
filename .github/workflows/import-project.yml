name: Import prepared project
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-project.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack the reviewed project
        shell: python
        run: |
          import hashlib, pathlib, zipfile
          root = pathlib.Path.cwd().resolve()
          archive = root / 'esp32-wifi-timer-github.zip'
          expected = 'c961938006fc17fb151ebc8cf09a8dd420d2424bf651f2d4ee659bf8f7a7971d'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
          count = 0
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              for item in z.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
                  if item.is_dir() or item.filename.startswith('.github/workflows/'):
                      continue
                  destination = (root / item.filename).resolve()
                  assert destination.is_relative_to(root)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(z.read(item))
                  count += 1
          assert count == 114, count
          archive.unlink()
          print(f'Imported {count} reviewed project files. Build workflow is installed separately.')
      - name: Commit project files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "Import reviewed ESP32 project sources, models and documentation"
          git push origin HEAD:main
