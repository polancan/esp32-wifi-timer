<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vyhlášení – nejlepší časy</title>
<style>
:root{--navy:#092541;--navy2:#123c62;--red:#d52b24;--gold:#ffd34e;--cream:#fffaf0;--ink:#172b3f;--muted:#60758a}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#071c31;color:#fff}body{background:radial-gradient(circle at 50% -20%,#1d517d 0,#0b2b4a 42%,#061827 100%)}
.top{position:sticky;top:0;z-index:4;display:grid;grid-template-columns:130px 1fr 220px;align-items:center;min-height:108px;padding:10px 24px;background:linear-gradient(90deg,#b91f1a,#df362c 43%,#b91f1a);border-bottom:7px solid var(--gold);box-shadow:0 8px 24px #0006}.shield{width:80px;height:80px;background:var(--navy);border:5px solid var(--gold);clip-path:polygon(50% 0,91% 17%,100% 58%,74% 100%,26% 100%,0 58%,9% 17%);display:grid;place-items:center;font-size:38px}.heading{text-align:center}.heading h1{font-size:clamp(28px,3vw,48px);line-height:1;margin:0;text-transform:uppercase;letter-spacing:.035em}.heading .session{margin-top:7px;font-size:clamp(15px,1.4vw,22px);font-weight:650;color:#fff3ce}.clock{text-align:right;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}.clock small{display:block;font-size:13px;color:#ffeaa7;text-transform:uppercase;letter-spacing:.08em}.board{padding:18px;display:grid;grid-template-columns:repeat(4,minmax(270px,1fr));gap:14px;max-width:1920px;margin:auto}.lane{background:var(--cream);color:var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 9px 25px #0005;border:2px solid #ffffff55;min-height:340px}.laneHead{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;color:#fff;background:linear-gradient(90deg,var(--navy2),var(--navy))}.laneHead b{font-size:25px}.laneHead span{font-size:12px;font-weight:800;color:#d4e5f3;letter-spacing:.08em}.rows{padding:8px 12px 14px}.row{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;min-height:48px;border-bottom:1px solid #dfe7ed}.row:last-child{border-bottom:0}.rank{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e9f1f6;color:#26445f;font-size:17px;font-weight:950}.row.first .rank{background:#ffd34e;color:#493600}.row.second .rank{background:#dce4ea;color:#34495b}.row.third .rank{background:#e7b47b;color:#533313}.name{min-width:0}.runner{font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.seq{font-size:11px;color:#7a8e9f;margin-top:2px}.time{font-size:21px;font-weight:950;font-variant-numeric:tabular-nums;color:#b42318;white-space:nowrap}.empty{padding:45px 10px;text-align:center;color:#8a9bab;font-style:italic}.waiting{min-height:calc(100vh - 115px);display:grid;place-items:center;text-align:center;padding:30px}.waiting .big{font-size:72px}.waiting h2{font-size:42px;margin:10px}.waiting p{font-size:22px;color:#c4d5e4}.statusdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#65d46e;margin-right:7px;box-shadow:0 0 12px #65d46e}.nav{position:fixed;right:12px;bottom:12px;z-index:5;display:flex;gap:8px}.nav a,.nav button{border:0;border-radius:9px;background:#071c31dd;color:#fff;padding:8px 11px;cursor:pointer;text-decoration:none;font:inherit;opacity:.35}.nav a:hover,.nav button:hover{opacity:1}.hose{position:fixed;inset:auto 0 0 0;height:9px;background:repeating-linear-gradient(90deg,#d52b24 0 70px,#f4c542 70px 82px);opacity:.7}@media(max-width:1350px){.board{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.top{grid-template-columns:70px 1fr}.clock{display:none}.shield{width:58px;height:58px;font-size:28px}.board{grid-template-columns:1fr;padding:10px}.lane{min-height:auto}}

/* Čistý vzhled pro vyhlášení; bez třídy theme-clean zůstává původní vzhled. */
body.theme-clean{background:#f3f6f9;color:#162235}
.theme-clean .top{min-height:74px;grid-template-columns:110px 1fr 190px;padding:10px 22px;background:#fff;border-bottom:1px solid #d7e0e8;box-shadow:0 2px 8px #14213d0a}
.theme-clean .shield{width:auto;height:auto;background:none;border:0;clip-path:none;font-size:30px;color:#17324d}
.theme-clean .heading h1{font-size:24px;color:#14213d;text-transform:none;letter-spacing:-.02em}.theme-clean .heading .session{font-size:14px;color:#5b6b7d}
.theme-clean .clock{font-size:24px;color:#14213d}.theme-clean .clock small{font-size:11px;color:#607286}
.theme-clean .board{padding:14px;gap:12px}.theme-clean .lane{background:#fff;color:#162235;border:1px solid #d5dee7;border-radius:10px;box-shadow:0 1px 3px #0f172a0a;min-height:320px}
.theme-clean .laneHead{height:46px;color:#162235;background:#f7f9fb;border-bottom:1px solid #e1e7ed}.theme-clean .laneHead b{font-size:17px}.theme-clean .laneHead span{color:#607286}
.theme-clean .rows{padding:7px 11px 12px}.theme-clean .row{border-bottom-color:#e3e9ee}.theme-clean .rank{border-radius:5px}.theme-clean .runner{font-size:16px}.theme-clean .time{font-size:18px;color:#162235}.theme-clean .nav a,.theme-clean .nav button{background:#17324de8}.theme-clean .hose{display:none}.theme-clean .waiting{color:#162235}.theme-clean .waiting p{color:#65778a}
</style></head><body class="theme-clean">
<header class="top"><div class="shield">🏆</div><div class="heading"><h1 id="title">Vyhlášení – TOP 5</h1><div id="session" class="session">Načítám…</div></div><div class="clock"><small><span class="statusdot"></span>výsledky</small><span id="clock">--:--:--</span></div></header>
<main id="board" class="board"></main><div class="nav"><a href="/">⌂ menu</a><a href="/display">průběh soutěže</a><button onclick="toggleFull()">⛶ celá obrazovka</button></div><div class="hose"></div>
<script>
let station='TIMER01',lastPayload='';const q=s=>document.querySelector(s);function applyTheme(v){document.body.classList.toggle('theme-clean',v!=='legacy');}const esc=v=>String(v??'').replace(/[&<>\'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function fmtTime(v){const n=Number(v||0);return n>=60?`${Math.floor(n/60)}:${(n%60).toFixed(3).padStart(6,'0')}`:`${n.toFixed(3)} s`;}
function laneCard(x){const rr=(x.top||[]).map(r=>`<div class="row ${r.rank===1?'first':r.rank===2?'second':r.rank===3?'third':''}"><div class="rank">${r.rank}</div><div class="name"><div class="runner">${esc(r.runnerName)}</div><div class="seq">startovní pořadí ${r.sequence}</div></div><div class="time">${fmtTime(r.durationSeconds)}</div></div>`).join('')||'<div class="empty">Zatím bez potvrzeného výsledku</div>';return `<section class="lane"><div class="laneHead"><b>DRÁHA ${x.lane}</b><span>TOP 5</span></div><div class="rows">${rr}</div></section>`;}
async function loadConfig(){const c=await fetch('/api/public/config').then(r=>r.json());station=new URLSearchParams(location.search).get('station')||c.defaultStationId||'TIMER01';}
async function refresh(){try{const r=await fetch('/api/public/top/'+encodeURIComponent(station)+'?take=5',{cache:'no-store'});if(!r.ok)throw new Error(r.status);const d=await r.json();applyTheme(d.uiTheme);const raw=JSON.stringify(d);if(raw===lastPayload)return;lastPayload=raw;if(!d.active){q('#session').textContent='Čekáme na spuštění soutěže';q('#board').className='waiting';q('#board').innerHTML='<div><div class="big">🏆</div><h2>Žebříček zatím není k dispozici</h2><p>TOP 5 se zobrazí po spuštění série a potvrzení prvních časů.</p></div>';return;}q('#session').textContent=(d.sessionName||'Probíhá soutěž')+' • 5 nejrychlejších na každé dráze';q('#board').className='board';q('#board').innerHTML=(d.lanes||[]).map(laneCard).join('');}catch(e){q('#session').textContent='Spojení se serverem bylo přerušeno';}}
function updateClock(){q('#clock').textContent=new Date().toLocaleTimeString('cs-CZ',{hour12:false});}async function toggleFull(){if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.();else await document.exitFullscreen?.();}
(async()=>{await loadConfig();await refresh();setInterval(refresh,1000);updateClock();setInterval(updateClock,1000);})();
</script></body></html>
