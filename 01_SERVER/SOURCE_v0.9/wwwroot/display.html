<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Časomíra – průběh soutěže</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",Arial,sans-serif}body{transition:background .15s,color .15s}.top{position:sticky;top:0;z-index:4}.heading h1{margin:0}.clock{font-variant-numeric:tabular-nums}.board{max-width:1920px;margin:auto}.lane{overflow:hidden}.runner,.rname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rtime{font-variant-numeric:tabular-nums;white-space:nowrap}.nav{position:fixed;right:12px;bottom:12px;z-index:5;display:flex;gap:7px}.nav a,.nav button{border:0;text-decoration:none;cursor:pointer;font:inherit}.waiting{min-height:calc(100vh - 90px);display:grid;place-items:center;text-align:center;padding:30px}.waiting .big{font-size:56px}.waiting h2{margin:8px 0}.statusdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#22a06b;margin-right:6px}

/* NOVÝ ČISTÝ VZHLED */
body.theme-clean{background:#f3f6f9;color:#162235}.theme-clean .top{display:grid;grid-template-columns:minmax(180px,1fr) minmax(280px,2fr) 190px;align-items:center;min-height:74px;padding:10px 22px;background:#fff;border-bottom:1px solid #d7e0e8;box-shadow:0 2px 8px #14213d0a}.theme-clean .shield{display:flex;align-items:center;gap:10px;width:auto;height:auto;background:none;border:0;clip-path:none;color:#17324d;font-size:0}.theme-clean .shield:before{content:'⏱';font-size:30px}.theme-clean .shield:after{content:'Časomíra';font-size:22px;font-weight:850;letter-spacing:-.02em}.theme-clean .heading{text-align:center;min-width:0}.theme-clean .heading h1{font-size:22px;color:#14213d;letter-spacing:-.02em}.theme-clean .heading .session{font-size:14px;color:#5b6b7d;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.theme-clean .clock{text-align:right;font-size:24px;font-weight:800;color:#14213d}.theme-clean .clock small{display:block;font-size:11px;color:#607286;font-weight:700;text-transform:uppercase;letter-spacing:.07em}.theme-clean .board{padding:14px;display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:12px}.theme-clean .lane{background:#fff;border:1px solid #d5dee7;border-radius:10px;min-height:390px;box-shadow:0 1px 3px #0f172a0a}.theme-clean .laneHead{height:43px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;background:#f7f9fb;border-bottom:1px solid #e1e7ed;color:#162235}.theme-clean .laneHead b{font-size:16px;letter-spacing:.025em}.theme-clean .count{font-size:11px;color:#6b7c8f}.theme-clean .current{margin:11px 11px 8px;padding:0;background:#fff}.theme-clean .tag{display:block;border-radius:6px;padding:7px 9px;background:#e7edf3;color:#47596c;text-align:center;font-size:12px;font-weight:850;letter-spacing:.035em}.theme-clean .current.ready .tag{background:#dcecff;color:#0759b6}.theme-clean .current.running .tag{background:#dff5e8;color:#08723c}.theme-clean .current.pending .tag{background:#fff1cf;color:#8c5d00}.theme-clean .current.offline .tag{background:#fee4e2;color:#b42318}.theme-clean .runner{font-size:21px;font-weight:850;margin-top:9px;color:#162235}.theme-clean .seq{font-size:12px;color:#6b7c8f;margin-top:1px}.theme-clean .statehint{font-size:11px;color:#78899a;margin-top:5px;min-height:14px}.theme-clean .running .statehint{color:#317451}.theme-clean .pending .statehint{color:#8c6a21}.theme-clean .offline .statehint{color:#a83b35}.theme-clean .pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#16a34a;margin-right:6px;animation:pulse 1s infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #16a34a66}50%{box-shadow:0 0 0 6px #16a34a00}}.theme-clean .upnext{margin:0 11px 9px;padding:8px 9px;background:#fafbfd;border:1px solid #e2e8ee;border-radius:7px}.theme-clean .upnext .label,.theme-clean .resultsTitle{font-size:10px;font-weight:850;color:#627487;letter-spacing:.055em;text-transform:uppercase}.theme-clean .nextname{font-size:13px;font-weight:650;color:#26384b;padding:2px 0}.theme-clean .results{margin:0 11px 11px}.theme-clean .resultsTitle{display:flex;justify-content:space-between;padding:3px 1px 4px}.theme-clean .result{display:grid;grid-template-columns:24px 1fr auto;gap:6px;align-items:center;min-height:29px;border-top:1px solid #e7ecf1}.theme-clean .rank{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;background:#eef2f6;color:#4a5c6f;font-size:11px;font-weight:850}.theme-clean .result.first .rank{background:#fff0b7;color:#755500}.theme-clean .result.second .rank{background:#e4e9ed;color:#445362}.theme-clean .result.third .rank{background:#f1dac2;color:#6b4425}.theme-clean .rname{font-size:13px;font-weight:650;color:#26384b}.theme-clean .rtime{font-size:14px;font-weight:850;color:#162235}.theme-clean .emptyResult{padding:10px 2px;color:#8695a5;font-size:12px;font-style:italic}.theme-clean .nav a,.theme-clean .nav button{border-radius:7px;background:#17324de8;color:#fff;padding:7px 10px;opacity:.25}.theme-clean .nav a:hover,.theme-clean .nav button:hover{opacity:1}.theme-clean .hose{display:none}.theme-clean .waiting{color:#162235}.theme-clean .waiting p{color:#65778a}

/* PŮVODNÍ VZHLED v0.6 */
body.theme-legacy{--navy:#092541;--navy2:#123c62;--red:#d52b24;--gold:#ffd34e;--cream:#fffaf0;--ink:#172b3f;background:radial-gradient(circle at 50% -20%,#1d517d 0,#0b2b4a 42%,#061827 100%);color:#fff}.theme-legacy .top{display:grid;grid-template-columns:130px 1fr 220px;align-items:center;min-height:108px;padding:10px 24px;background:linear-gradient(90deg,#b91f1a,#df362c 43%,#b91f1a);border-bottom:7px solid var(--gold);box-shadow:0 8px 24px #0006}.theme-legacy .shield{width:80px;height:80px;background:var(--navy);border:5px solid var(--gold);clip-path:polygon(50% 0,91% 17%,100% 58%,74% 100%,26% 100%,0 58%,9% 17%);display:grid;place-items:center;font-size:38px}.theme-legacy .heading{text-align:center}.theme-legacy .heading h1{font-size:clamp(28px,3vw,48px);line-height:1;text-transform:uppercase;letter-spacing:.035em}.theme-legacy .heading .session{margin-top:7px;font-size:clamp(15px,1.4vw,22px);font-weight:650;color:#fff3ce}.theme-legacy .clock{text-align:right;font-size:28px;font-weight:800}.theme-legacy .clock small{display:block;font-size:13px;color:#ffeaa7;text-transform:uppercase;letter-spacing:.08em}.theme-legacy .board{padding:16px;display:grid;grid-template-columns:repeat(4,minmax(265px,1fr));gap:13px}.theme-legacy .lane{background:var(--cream);color:var(--ink);border-radius:16px;box-shadow:0 9px 25px #0005;border:2px solid #ffffff55;min-height:420px}.theme-legacy .laneHead{height:52px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;color:#fff;background:linear-gradient(90deg,var(--navy2),var(--navy))}.theme-legacy .laneHead b{font-size:24px}.theme-legacy .count{font-size:12px;color:#d4e5f3}.theme-legacy .current{margin:10px 11px 8px;border-radius:11px;padding:9px 11px;background:#eef6fb;border-left:7px solid #3b82b5}.theme-legacy .current.running{background:#fff1e8;border-left-color:var(--red)}.theme-legacy .current.pending{background:#fff8d9;border-left-color:#e0a600}.theme-legacy .current.offline{background:#f5e9e9;border-left-color:#8e2f2f}.theme-legacy .tag{font-size:11px;font-weight:900;letter-spacing:.07em;color:#3d6988}.theme-legacy .running .tag{color:#bb261e}.theme-legacy .pending .tag{color:#916900}.theme-legacy .offline .tag{color:#7d2020}.theme-legacy .runner{font-size:clamp(20px,1.55vw,28px);font-weight:900;margin-top:2px}.theme-legacy .seq{font-size:11px;color:#75889a;margin-top:2px}.theme-legacy .statehint{font-size:11px;margin-top:3px;color:#687988}.theme-legacy .pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:#28a657;margin-right:6px;animation:pulse 1s infinite}.theme-legacy .upnext{margin:0 11px 9px;padding:7px 9px;border:1px dashed #bdcbd6;border-radius:9px;background:#fff}.theme-legacy .upnext .label{font-size:10px;font-weight:900;color:#6a7d8e;letter-spacing:.06em}.theme-legacy .nextname{font-weight:800;padding:1px 0;font-size:14px}.theme-legacy .results{margin:0 11px 12px}.theme-legacy .resultsTitle{font-size:11px;font-weight:950;color:#6a7d8e;letter-spacing:.06em;margin:0 0 3px;display:flex;justify-content:space-between}.theme-legacy .result{display:grid;grid-template-columns:26px 1fr auto;gap:5px;align-items:center;padding:4px 2px;border-bottom:1px solid #e3e9ee;min-height:31px}.theme-legacy .result:last-child{border-bottom:0}.theme-legacy .rank{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#e7edf2;color:#34516b;font-size:12px;font-weight:950}.theme-legacy .result.first .rank{background:#ffd34e;color:#493600}.theme-legacy .result.second .rank{background:#dce4ea;color:#34495b}.theme-legacy .result.third .rank{background:#e7b47b;color:#533313}.theme-legacy .rname{font-weight:800;font-size:14px}.theme-legacy .rtime{font-size:16px;font-weight:950;color:#b42318}.theme-legacy .emptyResult{padding:12px 3px;color:#8a9bab;font-style:italic;font-size:13px}.theme-legacy .waiting p{font-size:22px;color:#c4d5e4}.theme-legacy .nav a,.theme-legacy .nav button{border-radius:9px;background:#071c31dd;color:#fff;padding:8px 11px;opacity:.25}.theme-legacy .nav a:hover,.theme-legacy .nav button:hover{opacity:1}.theme-legacy .hose{position:fixed;inset:auto 0 0 0;height:9px;background:repeating-linear-gradient(90deg,#d52b24 0 70px,#f4c542 70px 82px);opacity:.7}

@media(max-width:1350px){.theme-clean .board,.theme-legacy .board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.theme-clean .top{grid-template-columns:1fr auto;padding:8px 12px}.theme-clean .heading{text-align:left}.theme-clean .shield{display:none}.theme-clean .clock{font-size:20px}.theme-clean .clock small{display:none}.theme-clean .board,.theme-legacy .board{grid-template-columns:1fr;padding:8px}.theme-clean .lane,.theme-legacy .lane{min-height:auto}.theme-legacy .top{grid-template-columns:70px 1fr}.theme-legacy .clock{display:none}.theme-legacy .shield{width:58px;height:58px;font-size:28px}.nav{display:none}}
</style></head>
<body class="theme-clean">
<header class="top"><div class="shield">🚒</div><div class="heading"><h1 id="title">Průběh soutěže</h1><div id="session" class="session">Načítám…</div></div><div class="clock"><small><span class="statusdot"></span>živý průběh</small><span id="clock">--:--:--</span></div></header>
<main id="board" class="board"></main><div class="nav"><a href="/">⌂ menu</a><a href="/top">🏆 vyhlášení</a><button onclick="toggleFull()">⛶ celá obrazovka</button></div><div class="hose"></div>
<script>
let station='TIMER01',lastPayload='',activeTheme='clean';const q=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>\'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function fmtTime(v){const n=Number(v||0);return n>=60?`${Math.floor(n/60)}:${(n%60).toFixed(3).padStart(6,'0')}`:`${n.toFixed(3)} s`;}
function applyTheme(v){activeTheme=v==='legacy'?'legacy':'clean';document.body.classList.remove('theme-clean','theme-legacy');document.body.classList.add('theme-'+activeTheme);}
function currentBlock(x){const cur=x.current;if(!cur)return `<div class="current"><div class="tag">DRÁHA DOKONČENA / ČEKÁ</div><div class="runner">—</div><div class="statehint">Na této dráze nyní není nikdo na startu.</div></div>`;const seq=`<div class="seq">startovní pořadí ${cur.sequence}</div>`;if(!x.deviceOnline)return `<div class="current offline"><div class="tag">⚠ STAV ČASOMÍRY NENÍ ONLINE</div><div class="runner">${esc(cur.runnerName)}</div>${seq}<div class="statehint">Nelze ověřit, zda byl START zaznamenán.</div></div>`;if(cur.state==='RUNNING')return `<div class="current running"><div class="tag"><span class="pulse"></span>BĚŽÍ – ČAS SE MĚŘÍ</div><div class="runner">${esc(cur.runnerName)}</div>${seq}<div class="statehint">START byl zachycen.</div></div>`;if(cur.state==='PENDING')return `<div class="current pending"><div class="tag">V CÍLI – ČEKÁ NA POTVRZENÍ</div><div class="runner">${esc(cur.runnerName)}</div>${seq}<div class="statehint">Běh skončil, výsledek čeká na zpracování.</div></div>`;return `<div class="current ready"><div class="tag">PŘIPRAVEN – ČEKÁ NA START</div><div class="runner">${esc(cur.runnerName)}</div>${seq}<div class="statehint">Pokud už běží, START nebyl zachycen.</div></div>`;}
function laneCard(x){let nx=(x.next||[]).map((n,i)=>`<div class="nextname">${i===0?'➜':'•'} <b>${n.sequence}.</b> ${esc(n.runnerName)}</div>`).join('')||'<div class="nextname">—</div>';let rr=(x.topResults||[]).map(r=>`<div class="result ${r.rank===1?'first':r.rank===2?'second':r.rank===3?'third':''}"><div class="rank">${r.rank}</div><div class="rname">${esc(r.runnerName)}</div><div class="rtime">${fmtTime(r.durationSeconds)}</div></div>`).join('')||'<div class="emptyResult">Zatím bez potvrzeného výsledku</div>';return `<section class="lane"><div class="laneHead"><b>DRÁHA ${x.lane}</b><span class="count">hotovo ${x.completed}/${x.total}</span></div>${currentBlock(x)}<div class="upnext"><div class="label">DALŠÍ NA ŘADĚ</div>${nx}</div><div class="results"><div class="resultsTitle"><span>TOP 5 – DRÁHA ${x.lane}</span><span>čas</span></div>${rr}</div></section>`;}
async function loadConfig(){const c=await fetch('/api/public/config').then(r=>r.json());station=new URLSearchParams(location.search).get('station')||c.defaultStationId||'TIMER01';q('#title').textContent='Průběh soutěže';document.title=(c.title||'Časomíra')+' – průběh soutěže';}
async function refresh(){try{const r=await fetch('/api/public/display/'+encodeURIComponent(station),{cache:'no-store'});if(!r.ok)throw new Error(r.status);const d=await r.json();applyTheme(d.uiTheme);const raw=JSON.stringify(d);if(raw===lastPayload)return;lastPayload=raw;if(!d.active){q('#session').textContent='Čekáme na spuštění soutěže';q('#board').className='waiting';q('#board').innerHTML='<div class="box"><div class="big">⏱</div><h2>Čekáme na další běhy</h2><p>Průběh soutěže se aktualizuje automaticky.</p></div>';return;}q('#session').textContent=(d.sessionName||'Probíhá soutěž')+' · aktuální běžci, další na řadě a TOP 5 na každé dráze';q('#board').className='board';q('#board').innerHTML=(d.lanes||[]).map(laneCard).join('');}catch(e){q('#session').textContent='Spojení se serverem bylo přerušeno';}}
function updateClock(){q('#clock').textContent=new Date().toLocaleTimeString('cs-CZ',{hour12:false});}async function toggleFull(){if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.();else await document.exitFullscreen?.();}
(async()=>{applyTheme('clean');await loadConfig();await refresh();setInterval(refresh,750);updateClock();setInterval(updateClock,1000);})();
</script></body></html>
